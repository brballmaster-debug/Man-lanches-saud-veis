<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maná Lanches Saudáveis</title>
    <meta name="description" content="Peça seus lanches saudáveis e deliciosos na Maná. Entregas agendadas com qualidade e sabor." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Cor institucional da marca na barra de status móvel -->
    <meta name="theme-color" content="#2D5A27" />
    
    <!-- Configurações PWA para iOS / Safari (ícone PNG obrigatório) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Maná" />
    <link rel="apple-touch-icon" href="/logo.png?v=5" />
    <style>
      html, body {
        background-color: #E8DFCE;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              // Auto-update: detecta novas versões do Service Worker
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Nova versão instalada: atualiza automaticamente a aplicação
                      console.log('Nova versão do app detectada. Atualizando...');
                      window.location.reload();
                    }
                  };
                }
              };
              // Verifica novas versões ao focar na aba
              window.addEventListener('focus', () => {
                reg.update().catch(() => {});
              });
            })
            .catch(err => console.log('Erro ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
