<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" role="img" aria-label="Maná Lanches Saudáveis">
  <defs>
    <!-- Gradiente Dourado Metálico do Relógio -->
    <linearGradient id="goldClockGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C5A666" />
      <stop offset="25%" stop-color="#DFCB99" />
      <stop offset="50%" stop-color="#C1A05A" />
      <stop offset="75%" stop-color="#E9DBB4" />
      <stop offset="100%" stop-color="#9E7E3C" />
    </linearGradient>

    <!-- Gradiente Dourado dos Ponteiros e Marcadores -->
    <linearGradient id="goldDetailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C28E" />
      <stop offset="50%" stop-color="#BE9E5A" />
      <stop offset="100%" stop-color="#9C7B38" />
    </linearGradient>

    <!-- Gradiente Verde Escuro Orgânico das Letras Maná -->
    <linearGradient id="manaGreenText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#557F2B" />
      <stop offset="45%" stop-color="#42651F" />
      <stop offset="100%" stop-color="#2D4814" />
    </linearGradient>

    <!-- Gradiente Verde da Folha do Acento -->
    <linearGradient id="leafAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C611C" />
      <stop offset="50%" stop-color="#5D922E" />
      <stop offset="100%" stop-color="#7EB942" />
    </linearGradient>

    <!-- Sombra sutil para relevo suave da marca -->
    <filter id="manaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263813" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ================= RELÓGIO DOURADO ================= -->
  <!-- Arco Superior do Relógio (interrompido nas laterais para o Maná) -->
  <path 
    d="M 112 230 A 150 150 0 0 1 388 230" 
    stroke="url(#goldClockGrad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    fill="none" 
  />

  <!-- Marcadores Horários (Tracinhos Radiais Dourados) -->
  <!-- 12 horas -->
  <line x1="250" y1="92" x2="250" y2="110" stroke="url(#goldDetailGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- 11 horas -->
  <line x1="197" y1="106" x2="204" y2="123" stroke="url(#goldDetailGrad)" stroke-width="2.6" stroke-linecap="round" />
  <!-- 10 horas -->
  <line x1="152" y1="145" x2="164" y2="159" stroke="url(#goldDetailGrad)" stroke-width="2.6" stroke-linecap="round" />
  <!-- 1 hora -->
  <line x1="303" y1="106" x2="296" y2="123" stroke="url(#goldDetailGrad)" stroke-width="2.6" stroke-linecap="round" />
  <!-- 2 horas -->
  <line x1="348" y1="145" x2="336" y2="159" stroke="url(#goldDetailGrad)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Centro e Ponteiros do Relógio -->
  <g transform="translate(250, 226)">
    <!-- Ponteiro dos minutos (apontando verticalmente para cima às 12h) -->
    <path d="M -1.8 0 L -1.2 -48 Q 0 -54 1.2 -48 L 1.8 0 Z" fill="url(#goldDetailGrad)" />
    <!-- Ponteiro das horas (inclinado a ~40 graus apontando para ~1h45) -->
    <g transform="rotate(42)">
      <path d="M -2 0 L -1.5 -34 Q 0 -40 1.5 -34 L 2 0 Z" fill="url(#goldDetailGrad)" />
    </g>
    <!-- Pivô circular dourado metálico no centro -->
    <circle cx="0" cy="0" r="7.5" fill="url(#goldClockGrad)" />
    <circle cx="0" cy="0" r="3.5" fill="#FDFBF7" opacity="0.6" />
  </g>

  <!-- ================= PALAVRA "Maná" CALIGRÁFICA ================= -->
  <g filter="url(#manaShadow)">
    <!-- Letra 'M' Cursiva Caligráfica -->
    <!-- Entrada suave com gancho esquerdo do M -->
    <path 
      d="M 94 250 
         C 88 238 98 230 110 232 
         C 126 235 131 254 128 274 
         C 125 292 118 300 112 300 
         C 107 300 106 295 110 280 
         C 116 256 123 234 135 234 
         C 145 234 148 248 147 266 
         C 145 284 142 296 142 296
         C 142 296 154 246 168 238 
         C 178 232 186 238 184 254 
         C 181 274 177 288 174 296 
         C 172 301 176 303 182 298
         C 188 293 194 284 198 274" 
      fill="none" 
      stroke="url(#manaGreenText)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letra 'a' conectada -->
    <path 
      d="M 235 258 
         C 230 245 212 242 202 254 
         C 192 266 193 286 206 297 
         C 217 304 233 298 236 284
         L 236 296
         C 236 300 242 302 248 296
         C 255 289 259 278 261 268" 
      fill="none" 
      stroke="url(#manaGreenText)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Fechamento oval do corpo do 'a' -->
    <path 
      d="M 233 260 
         C 233 250 216 248 207 260 
         C 197 272 198 288 209 294 
         C 219 299 233 292 233 276 Z" 
      fill="url(#manaGreenText)" 
    />

    <!-- Letra 'n' cursiva -->
    <path 
      d="M 261 270 
         C 265 256 270 245 279 245 
         C 287 245 289 255 286 270 
         L 282 296 
         M 284 266 
         C 290 252 301 245 311 246 
         C 321 248 322 258 319 274 
         L 315 296 
         C 314 300 320 302 326 296
         C 334 288 338 276 341 266" 
      fill="none" 
      stroke="url(#manaGreenText)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letra 'á' cursiva final -->
    <path 
      d="M 374 258 
         C 369 245 351 242 341 254 
         C 331 266 332 286 345 297 
         C 356 304 372 298 375 284
         L 375 296
         C 375 301 384 304 394 297
         C 404 290 412 278 418 266" 
      fill="none" 
      stroke="url(#manaGreenText)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Fechamento oval do corpo do segundo 'a' -->
    <path 
      d="M 372 260 
         C 372 250 355 248 346 260 
         C 336 272 337 288 348 294 
         C 358 299 372 292 372 276 Z" 
      fill="url(#manaGreenText)" 
    />

    <!-- ================= FOLHA VERDE ORGÂNICA (Acento Agudo sobre o 'á') ================= -->
    <g transform="translate(382, 218) rotate(-22)">
      <!-- Corpo da folha -->
      <path 
        d="M 0 24 
           C -12 16 -18 2 0 -22 
           C 18 2 12 16 0 24 Z" 
        fill="url(#leafAccentGrad)" 
      />
      <!-- Nervura central delicada -->
      <path 
        d="M 0 22 C 0 8 0 -6 0 -18" 
        stroke="#284410" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        opacity="0.6" 
      />
      <!-- Nervuras secundárias sutis -->
      <path d="M 0 4 Q -4 -1 -7 0" stroke="#FDFBF7" stroke-width="0.8" stroke-linecap="round" opacity="0.3" />
      <path d="M 0 10 Q 4 5 7 6" stroke="#FDFBF7" stroke-width="0.8" stroke-linecap="round" opacity="0.3" />
    </g>
  </g>

  <!-- ================= SUBTÍTULO "LANCHES SAUDÁVEIS" ================= -->
  <text 
    x="250" 
    y="330" 
    text-anchor="middle" 
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="19" 
    font-weight="500" 
    letter-spacing="0.22em" 
    fill="#576348"
  >
    LANCHES SAUDÁVEIS
  </text>

  <!-- ================= PARTE INFERIOR DO RELÓGIO ================= -->
  <!-- Arco inferior dourado -->
  <path 
    d="M 160 365 A 150 150 0 0 0 340 365" 
    stroke="url(#goldClockGrad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    fill="none" 
  />
  <!-- Marcador das 6 horas -->
  <line x1="250" y1="372" x2="250" y2="390" stroke="url(#goldDetailGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
